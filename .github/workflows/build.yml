name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AF1ACB: ${{ secrets.AF1ACB }}
          BBB48C: ${{ secrets.BBB48C }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AF1ACB', '')
          bm = os.environ.get('BBB48C', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 80716f8e78bb4127eb5ebb7b4b58153fe8e8577c -->', gm)
          if bm:
              s2 = s2.replace('<!-- c1e407278a6099b309e027d4af6233b9e5 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
